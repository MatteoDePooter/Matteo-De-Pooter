<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Portfolio | Matteo De Pooter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { 
      --radius: clamp(160px, 25vh, 280px); 
    }

    html, body {
      height: auto; /* Aangepast voor scrollen */
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      background-color: #f8fafc;
    }

    /* Navigatie altijd zichtbaar maken */
    nav {
      position: sticky !important;
      top: 0;
      width: 100%;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.5);
    }

    .hero-fold {
      height: 85vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    #wheel-container {
      position: relative;
      width: 100%;
      flex-grow: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: grab;
      touch-action: none;
    }

    #wheel {
      position: absolute;
      top: 90%; 
      width: 0; height: 0;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
    }

    .center-info {
      position: absolute;
      top: 70%;
      transform: translateY(-50%);
      text-align: center;
      z-index: 10; /* Lager dan de klikbare items */
      width: 80%;
      max-width: 250px;
      pointer-events: none; /* Klikken gaat door de tekst naar het wiel */
    }

    #info-title {
      font-size: clamp(1.5rem, 4vw, 2rem); 
      font-weight: 800;
      line-height: 1.1;
      word-wrap: break-word;
      margin: 0 auto;
    }

    .week-item {
      position: absolute;
      left: 0; top: 0;
      width: clamp(50px, 8vh, 70px); 
      height: clamp(50px, 8vh, 70px);
      margin-left: calc(clamp(50px, 8vh, 70px) / -2);
      margin-top: calc(clamp(50px, 8vh, 70px) / -2);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .week-circle {
      width: 100%; height: 100%;
      background: white;
      border: 2px solid #e2e8f0;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      color: #94a3b8;
      transition: all 0.4s;
      font-size: 1.2rem;
      cursor: pointer;
      text-decoration: none; /* Voor de <a> tag */
    }

    .week-circle.active {
      border-color: #6366f1;
      background: #6366f1;
      color: white;
      transform: scale(1.2);
      box-shadow: 0 10px 20px rgba(99, 102, 241, 0.3);
    }

    #vorigevolgende {
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding-bottom: 2em;
      z-index: 60;
      position: sticky;
    }

     .report-card:hover {
      transform: translateY(-12px);
      border-color: #6366f1;
      box-shadow: 0 25px 50px -12px rgba(99, 102, 241, 0.15);
    }

    .nav-btn {
      padding: 0.8rem 2rem;
      border-radius: 9999px;
      background-color: #0f172a;
      color: white;
      font-weight: 700;
      font-size: 0.8rem;
      transition: 0.3s;
    }

    #cardGrid {
      display: flex;
      gap: 2rem;
      padding: 4rem 10vw;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    #cardGrid::-webkit-scrollbar { display: none; }

    .report-card {
      min-width: 300px;
      scroll-snap-align: center;
      background: white;
      border-radius: 2rem;
      padding: 2.5rem;
      position: relative;
      overflow: hidden;
      border: 1px solid #e2e8f0;
      text-decoration: none;
      color: inherit;
    }

    .bg-number-card {
      position: absolute;
      right: -5px; bottom: -10px;
      font-size: 8rem;
      font-weight: 900;
      color: rgba(99, 102, 241, 0.04);
      z-index: 0;
      font-style: italic;
    }
  </style>
</head>

<body>

    <nav class="sticky top-0 z-[100] bg-white/60 backdrop-blur-xl border-b border-slate-200/50">
      <div class="max-w-6xl mx-auto px-6 md:px-8 h-20 flex items-center justify-between">
        <a href="index.html" class="flex items-center">
          <span class="text-lg md:text-xl font-black tracking-tighter bg-gradient-to-r from-indigo-600    to-purple-600 bg-clip-text text-transparent italic">
            MATTEO <span class="text-indigo-600">DE POOTER</span> <span class="text-slate-400     font-light ml-2 not-italic text-xs md:text-sm">1GDM1</span>
          </span>
        </a>
        <div class="flex items-center gap-6 md:gap-10 text-[10px] md:text-sm font-bold tracking-widest    uppercase">
          <a href="index.html" class="text-indigo-600 border-b-2 border-indigo-600 pb-1">Home</a>
          <a href="reports.html" class="text-slate-400 hover:text-indigo-600 transition">Reports</a>
        </div>
      </div>
    </nav>

  <div class="hero-fold">
    <header class="pt-6 text-center shrink-0">
      <h1 class="text-4xl md:text-5xl font-black uppercase leading-tight">
        Weekly<br><span class="bg-gradient-to-r from-indigo-600 to-pink-500 bg-clip-text text-transparent">Journal.</span>
      </h1>
    </header>

    <div id="wheel-container">
      <div class="center-info">
        <span id="info-desc" class="text-indigo-600 font-black tracking-widest text-sm uppercase">Week 01</span>
        <h3 id="info-title" class="text-3xl font-black text-slate-900">De Opstart</h3>
      </div>
      <div id="wheel"></div>
    </div>

    <div id="vorigevolgende">
      <button onclick="navigate(1)" class="nav-btn">← VORIGE</button>
      <button onclick="navigate(-1)" class="nav-btn">VOLGENDE →</button>
    </div>
  </div>

  <section class="bg-white">
    <div id="cardGrid"></div>
  </section>

  <script>
    const reports = [
      { w: "01", t: "De Opstart", d: "Eerste Website", l: "Week1.html" },
      { w: "02", t: "Low-Fidelity Prototypes", d: "Concepten Schermen", l: "week2.html" },
      { w: "03", t: "Midi-Prototypes", d: "Eerste Figma Scherm", l: "Week3.html" },
      { w: "04", t: "Code Midi-Prototypes", d: "Coding Phase", l: "week4.html" },
      { w: "05", t: "Design Systems", d: "Components", l: "week5.html" },
      { w: "06", t: "Mid-term", d: "Review", l: "week6.html" },
      { w: "07", t: "JS Basics", d: "Variables", l: "week7.html" },
      { w: "08", t: "Interactiviteit", d: "DOM", l: "week8.html" },
      { w: "09", t: "Tailwind", d: "Installeren van Tailwind", l: "week9.html" },
      { w: "10", t: "Tailwind Toepassing", d: "Styling", l: "week10.html" },
      { w: "11", t: "App Voor Schermen", d: "Eind Resultaat Schermen", l: "week11.html" },
      { w: "12", t: "Finalizeren", d: "Het Eind Resultaat", l: "week12.html" }
    ];

    const wheel = document.getElementById('wheel');
    const cardGrid = document.getElementById('cardGrid');
    
    reports.forEach((r, i) => {
      // Wiel items veranderd naar <a> tags om klikbaar te maken
      wheel.innerHTML += `
        <div class="week-item" style="transform: rotate(${i * 30}deg) translateY(calc(-1 * var(--radius)))">
          <a href="${r.l}" class="week-circle ${i===0?'active':''}" data-index="${i}">${r.w}</a>
        </div>`;
      
      cardGrid.innerHTML += `
        <a href="${r.l}" class="report-card group">
          <div class="bg-number-card">${r.w}</div>
          <span class="text-4xl font-black text-indigo-600/20 italic">${r.w}</span>
          <h3 class="text-xl font-bold mt-4">${r.t}</h3>
          <p class="text-slate-400 text-xs mt-1">${r.d}</p>
        </a>`;
    });

    let currentRotation = 0;
    const circles = document.querySelectorAll('.week-circle');

    function navigate(direction) {
      currentRotation += (direction * 30);
      rotateTo(currentRotation);
    }

    function rotateTo(deg) {
      wheel.style.transform = `rotate(${deg}deg)`;
      let activeIndex = Math.round((deg / -30) % 12);
      if (activeIndex < 0) activeIndex += 12;

      circles.forEach((circle, i) => {
        circle.style.transform = `rotate(${- (i * 30) - deg}deg)`;
        circle.classList.toggle('active', i === activeIndex);
        if(i === activeIndex) {
          document.getElementById('info-title').innerText = reports[activeIndex].t;
          document.getElementById('info-desc').innerText = "WEEK " + reports[activeIndex].w;
          
          const cards = document.querySelectorAll('.report-card');
          cardGrid.scrollTo({ left: cards[activeIndex].offsetLeft - 100, behavior: 'smooth' });
        }
      });
    }

    // Dragging logica
    let isDragging = false; let startX = 0;
    const container = document.getElementById('wheel-container');

    container.onmousedown = (e) => { isDragging = true; startX = e.pageX; wheel.style.transition = 'none'; };
    window.onmousemove = (e) => {
      if (!isDragging) return;
      const move = (e.pageX - startX) * 0.4;
      wheel.style.transform = `rotate(${currentRotation + move}deg)`;
      circles.forEach((c, i) => c.style.transform = `rotate(${- (i * 30) - (currentRotation + move)}deg)`);
    };
    window.onmouseup = (e) => {
      if (!isDragging) return;
      isDragging = false;
      wheel.style.transition = 'transform 0.8s cubic-bezier(0.16, 1, 0.3, 1)';
      currentRotation = Math.round((currentRotation + (e.pageX - startX) * 0.4) / 30) * 30;
      rotateTo(currentRotation);
    };

    rotateTo(0);
  </script>

  <footer class="py-12 text-center text-slate-400 text-xs font-bold uppercase tracking-widest bg-white">
    <p>© Matteo De Pooter — 1GDM1 — <a target="_blank" href="https://github.com/MatteoDePooter/Matteo-De-Pooter" class="text-indigo-600 underline">GitHub</a></p>
  </footer>

</body>
</html>
